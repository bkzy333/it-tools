  content-fork: >-
    # Acerca de IT-Tools

    Este maravilloso sitio web, creado con ❤ inicialmente por [Corentin
    Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about) y
    ampliado por ShareVB, reúne herramientas útiles para desarrolladores y
    profesionales de TI. Si te resulta útil, compártelo con quienes creas que
    también lo puedan encontrar y no olvides guardarlo en tus favoritos.

    IT Tools es de código abierto (bajo la licencia GPL-3.0) y gratuito, y
    siempre lo será. Si quieres apoyar mi trabajo en esta bifurcación y animarme
    a añadir más herramientas o funcionalidades, considera
    [patrocinarme](https://www.buymeacoffee.com/sharevb).

    ## Tecnologías

    IT Tools está desarrollado en Vue.js (Vue 3) con la biblioteca de
    componentes Naive UI y está alojado e implementado continuamente por Vercel.
    Algunas herramientas utilizan bibliotecas de código abierto de terceros.
    Puede encontrar la lista completa en el archivo
    [package.json](https://github.com/sharevb/it-tools/blob/main/package.json)
    del repositorio.

    ## ¿Encontró un error? ¿Falta alguna herramienta?

    Si necesita una herramienta que actualmente no está disponible aquí y cree
    que puede ser útil, puede enviar una solicitud de funcionalidad en la
    sección [issues](https://github.com/sharevb/it-tools/issues/new/choose) del
    repositorio de GitHub.

    Y si encuentra un error o algo no funciona como se esperaba, envíe un
    informe de error en la sección
    [issues](https://github.com/sharevb/it-tools/issues/new/choose) del
    repositorio de GitHub.
