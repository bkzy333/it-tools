  content-fork: >+
    # Om IT-verktøy

    Denne fantastiske nettsiden, laget med ❤, opprinnelig av [Corentin
    Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about) og
    utvidet av ShareVB, samler nyttige verktøy for utviklere og folk som jobber
    innen IT. Hvis du synes den er nyttig, kan du gjerne dele den med folk du
    tror kan synes den er nyttig også, og ikke glem å bokmerke den i
    snarveilinjen din!

    IT Tools er åpen kildekode (under GPL-3.0-lisensen) og gratis, og vil alltid
    være det. Hvis du vil støtte arbeidet mitt på denne fork, og oppmuntre meg
    til å legge til flere verktøy eller funksjoner, kan du vurdere å støtte ved
    å [sponse meg](https://www.buymeacoffee.com/sharevb).

    ## Teknologier

    IT Tools er laget i Vue.js (Vue 3) med Naive UI-komponentbiblioteket og
    driftes og distribueres kontinuerlig av Vercel. Tredjepartsbiblioteker med
    åpen kildekode brukes i noen verktøy. Du finner den komplette listen i filen
    [package.json](https://github.com/sharevb/it-tools/blob/main/package.json) i
    depotet.


    ## Fant du en feil? Mangler et verktøy?

    Hvis du trenger et verktøy som ikke finnes her, og du tror kan være nyttig,
    kan du sende inn en funksjonsforespørsel i
    [problemseksjonen](https://github.com/sharevb/it-tools/issues/new/choose) i
    GitHub-depotet.

    Og hvis du fant en feil, eller noe ikke fungerer som forventet, kan du sende
    inn en feilrapport i
    [problemseksjonen](https://github.com/sharevb/it-tools/issues/new/choose) i
    GitHub-depotet.

