about:
  alltools-title: Tutti gli strumenti {toolsCount}
  tools:
    name: Nome
    desc: Descrizione
    category: Categoria
  content-fork: >
    # Informazioni su IT-Tools

    Questo meraviglioso sito web, inizialmente creato con ❤ da [Corentin
    Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about) e
    ampliato da ShareVB, raccoglie strumenti utili per sviluppatori e
    professionisti IT. Se lo trovate utile, condividetelo con chi pensate possa
    esserlo e non dimenticate di aggiungerlo ai preferiti nella barra delle
    applicazioni!

    IT Tools è open source (con licenza GPL-3.0) e gratuito, e lo sarà sempre.
    Se volete supportare il mio lavoro su questo fork e incoraggiarmi ad
    aggiungere altri strumenti o funzionalità, considerate la possibilità di
    [sponsorizzarmi](https://www.buymeacoffee.com/sharevb).

    ## Tecnologie

    IT Tools è realizzato in Vue.js (Vue 3) con la libreria di componenti Naive
    UI ed è ospitato e distribuito costantemente da Vercel. In alcuni strumenti
    vengono utilizzate librerie open source di terze parti; l'elenco completo è
    disponibile nel file
    [package.json](https://github.com/sharevb/it-tools/blob/main/package.json)
    del repository.

    ## Hai trovato un bug? Manca uno strumento?

    Se ti serve uno strumento che al momento non è presente qui e ritieni possa
    essere utile, puoi inviare una richiesta di funzionalità nella [sezione
    problemi](https://github.com/sharevb/it-tools/issues/new/choose) del
    repository GitHub.

    Se hai trovato un bug o qualcosa non funziona come previsto, invia una
    segnalazione di bug nella [sezione
    problemi](https://github.com/sharevb/it-tools/issues/new/choose) del
    repository GitHub.
