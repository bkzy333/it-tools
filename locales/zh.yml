      title-notice: 关于算法
      hint-notice: 折算年化利率 = 真实月利率 × 12，真实月利率用
        IRR（内部收益率）二分法解出，即让「实际收到的本金」等于「未来各期还款的现值」的那个利率。手续费按原本金全额收取，而你每月都在偿还本金，借款余额逐月减少而手续费不变，所以真实利率远高于表面年化。各银行合同里必须披露的「折算年化利率」就是本工具给出的这个数，如与实际合同有差异以银行为准。
