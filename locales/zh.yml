  content-fork: >
    # 关于 IT-Tools

    这个精彩的网站最初由 [Corentin
    Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about)
    倾情打造，并由 ShareVB 进行扩展，汇集了开发者和 IT
    工作者所需的实用工具。如果您觉得它有用，请分享给您认为可能也会有用的人，别忘了将其添加到您的快捷方式栏中！

    IT Tools 是开源的（遵循 GPL-3.0 许可证），并且永远免费。如果您想支持我在此分支上的工作，并鼓励我添加更多工具或功能，请考虑通过
    [赞助我](https://www.buymeacoffee.com/sharevb) 来支持。

    ## 技术

    IT Tools 使用 Vue.js (Vue 3) 和 Naive UI 组件库开发，并由 Vercel
    托管和持续部署。部分工具使用了第三方开源库，您可以在代码库的
    [package.json](https://github.com/sharevb/it-tools/blob/main/package.json)
    文件中找到完整列表。

    ## 发现错误？缺少工具？

    如果您需要某个工具，而该工具目前尚未提供，并且您认为它很有用，欢迎在 GitHub 代码库的
    [issues](https://github.com/sharevb/it-tools/issues/new/choose) 部分提交功能请求。

    如果您发现错误，或者某些功能无法按预期运行，请在 GitHub 代码库的
    [issues](https://github.com/sharevb/it-tools/issues/new/choose) 部分提交错误报告。
  text:
    collection-of-handy-online-tools-for-developers-with-great-ux-it-tools-is-a-free-and-open-source-collection-of-handy-online-tools-for-developers-and-people-working-in-it: IT Tools 是一款免费开源的在线工具合集，为开发人员和 IT 从业人员提供便捷的在线工具，拥有出色的用户体验。
    about-it-tools: 关于 - IT 工具
