      tab-request-headers: 请求头（已发送）
      tab-response-body: 响应体
      response-view-pretty: 美化
      response-view-raw: 原始
      title-codegen: 代码生成
      tip-codegen: 根据当前请求配置生成各语言代码，一键复制即可使用。
      title-examples: 场景示例与帮助
      collapse-examples: 场景示例
      title-guide: 操作说明
      guide-text: |
        1. 在「请求 URL」填入完整接口地址。
        2. 选择请求方法（GET / POST / PUT / DELETE / PATCH / HEAD / OPTIONS）。
        3. 在「查询参数」「请求头」里逐行添加，或点「批量添加」一次性粘贴 a=1&b=2 / JSON / 抓包得到的 Header 文本。
        4. 需要请求体时，切到「请求体」选择表单或原始内容；原始内容支持「格式化 / 压缩」JSON。
        5. 也可在「导入」里粘贴 curl、PowerShell、fetch 或 Java Map 代码，一键解析填充。
        6. 点「发送请求」：默认走服务端代理（绕开浏览器跨域）；如遇代理不可用，关闭开关改用浏览器直连（仅能访问允许跨域的接口）。
        7. 响应区可查看状态码、耗时、请求头、返回头（均可一键复制）与响应体（可美化 / 压缩 / 复制 / 下载）。
        8. 在「代码生成」里一键复制 Python / C# / Java / Go / Node.js / PHP / cURL 代码片段。
      title-cors: 跨域访问配置说明
      cors-text: |
        为什么会跨域（CORS）？
        浏览器出于安全，禁止网页向「不同源」的接口发请求，除非对方服务器返回允许跨域的响应头（Access-Control-Allow-Origin）。因此纯前端直连很多第三方接口会被浏览器拦截，表现为「调用报错」。
        
        两种解决方式：
        · 服务端代理（默认开启）：请求先发到本站的 /api/proxy，由服务端（Cloudflare）代为转发再返回。请求发生在服务器而非浏览器，不受浏览器跨域限制，可访问任意接口。
        · 浏览器直连：关闭代理开关后由浏览器直接请求目标接口，仅适用于对方服务器允许跨域（返回了 CORS 头）的情况；否则仍会被拦截。
        
        提示：若你自己的后端希望被本站调用，请在响应里加上 Access-Control-Allow-Origin: *（或指定来源）等 CORS 头。
