      label-total-repayment: Total repaid
      label-monthly-irr: Real monthly rate
      label-compound-rate: Compounded annual rate
      title-compare: Across instalment lengths
      tag-current: Current
      hint-compare: At the same 0.6% per month the effective annual rate stays around
        13% whether you spread it over 3 or 36 periods. A longer term does not
        lower the real rate, it only increases the total fee.
      title-notice: About the maths
      hint-notice: The effective annual rate is the real monthly rate times 12. The
        monthly rate is solved by bisection on IRR, the rate that makes the net
        amount received equal the present value of all repayments. The fee is
        charged on the full original amount while the balance falls every month,
        which is why the real cost is far above the advertised figure. Banks
        must disclose this same effective rate in their contracts; the bank
        figure prevails if it differs.
