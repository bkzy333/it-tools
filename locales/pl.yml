  content-fork: >
    # O IT-Tools

    Ta wspaniała strona internetowa, stworzona z pasją (❤) przez [Corentina
    Thomasseta](https://corentin.tech?utm_source=it-tools&utm_medium=about) i
    rozbudowana o ShareVB, gromadzi przydatne narzędzia dla programistów i osób
    pracujących w branży IT. Jeśli uznasz ją za przydatną, podziel się nią z
    innymi, którzy mogą się z nią również zapoznać, i nie zapomnij dodać jej do
    zakładek w pasku skrótów!

    IT Tools jest projektem open-source (na licencji GPL-3.0) i darmowym, i
    zawsze takim pozostanie. Jeśli chcesz wesprzeć moją pracę nad tym forkiem i
    zachęcić mnie do dodawania kolejnych narzędzi lub funkcjonalności, rozważ
    wsparcie poprzez [sponsorowanie](https://www.buymeacoffee.com/sharevb).

    ## Technologie

    IT Tools jest stworzony w Vue.js (Vue 3) z biblioteką komponentów Naive UI i
    jest hostowany oraz stale wdrażany przez Vercel. W niektórych narzędziach
    wykorzystywane są biblioteki open source innych firm. Pełną listę można
    znaleźć w pliku
    [package.json](https://github.com/sharevb/it-tools/blob/main/package.json) w
    repozytorium.

    ## Znalazłeś błąd? Brakuje narzędzia?

    Jeśli potrzebujesz narzędzia, którego obecnie tu nie ma, a uważasz, że może
    być przydatne, możesz przesłać prośbę o dodanie funkcji w [sekcji
    zgłoszeń](https://github.com/sharevb/it-tools/issues/new/choose) w
    repozytorium GitHub.

    A jeśli znalazłeś błąd lub coś nie działa zgodnie z oczekiwaniami, zgłoś
    błąd w [sekcji
    zgłoszeń](https://github.com/sharevb/it-tools/issues/new/choose) w
    repozytorium GitHub.
  text:
    collection-of-handy-online-tools-for-developers-with-great-ux-it-tools-is-a-free-and-open-source-collection-of-handy-online-tools-for-developers-and-people-working-in-it:
