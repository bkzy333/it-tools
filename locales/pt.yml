  content-fork: >
    # Sobre o IT-Tools

    Este site maravilhoso, criado com ❤ inicialmente por [Corentin
    Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about) e
    estendido pelo ShareVB, reúne ferramentas úteis para desenvolvedores e
    profissionais de TI. Se você achar útil, sinta-se à vontade para
    compartilhá-lo com pessoas que você acha que também podem achar útil e não
    se esqueça de adicioná-lo aos seus favoritos na barra de atalhos!

    O IT Tools é de código aberto (sob a licença GPL-3.0) e gratuito, e sempre
    será. Se você quiser apoiar meu trabalho neste fork e me incentivar a
    adicionar mais ferramentas ou funcionalidades, considere me apoiar
    [patrocinando](https://www.buymeacoffee.com/sharevb).

    ## Tecnologias

    O IT Tools é desenvolvido em Vue.js (Vue 3) com a biblioteca de componentes
    Naive UI e é hospedado e continuamente implantado pela Vercel. Bibliotecas
    de código aberto de terceiros são usadas em algumas ferramentas. Você pode
    encontrar a lista completa no arquivo
    [package.json](https://github.com/sharevb/it-tools/blob/main/package.json)
    do repositório.

    ## Encontrou um bug? Falta uma ferramenta?

    Se precisar de uma ferramenta que não esteja aqui e que considere útil,
    sinta-se à vontade para enviar uma solicitação de recurso na [seção de
    problemas](https://github.com/sharevb/it-tools/issues/new/choose) do
    repositório GitHub.

    E se encontrar um bug ou algo não funcionar como esperado, registre um
    relatório de bug na [seção de
    problemas](https://github.com/sharevb/it-tools/issues/new/choose) do
    repositório GitHub.
  text:
